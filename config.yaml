    enabled: true
  telegram:
    enabled: true
    instances:
      - name: notifier
        bot_token_env: TELEGRAM_NOTIFIER_BOT_TOKEN
        allowed_user_ids_env: TELEGRAM_NOTIFIER_ALLOWED_USER_ID
      - name: apollo
        bot_token_env: TELEGRAM_BOT_TOKEN
