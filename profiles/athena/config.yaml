model:
  default: deepseek-v4-flash
  provider: ollama-cloud
providers:
  ollama-default:
    api: http://127.0.0.1:11434/v1
    name: Ollama (default)
    default_model: qwen3-hermes-14b
    models:
      - id: qwen3-hermes-14b
        context_length: 65536
      - id: qwen3-hermes-8b
        context_length: 65536
    context_length: 65536
    api_key: ollama
  ollama-fast:
    api: http://127.0.0.1:11434/v1
    name: Ollama Fast
    default_model: qwen3-hermes-8b
    models:
      - id: qwen3-hermes-14b
        context_length: 65536
      - id: qwen3-hermes-8b
        context_length: 65536
    context_length: 65536
    api_key: ollama
  custom:
    api: http://127.0.0.1:9099/v1
    name: Ollama Cloud (via proxy)
    api_key: ${OLLAMA_API_KEY}
    context_length: 262144
  cursor-go:
    name: Cursor (Go Adapter)
    api: http://127.0.0.1:9101/v1
    key_env: CURSOR_API_KEY
    default_model: gpt-5.4-nano-low
    models:
      - id: gpt-5.4-nano
        context_length: 400000
      - id: gpt-5.4-nano-low
        context_length: 400000
      - id: gpt-5.4-nano-medium
        context_length: 400000
      - id: gpt-5.4-nano-high
        context_length: 400000
      - id: gpt-5-mini
        context_length: 400000
      - id: gpt-5.6-luna
        context_length: 1050000
      - id: gpt-5.4-mini
        context_length: 400000
  ollama-cloud:
    api: https://ollama.com/v1
    name: Ollama Cloud
    key_env: OLLAMA_API_KEY
    context_length: 262144
  ollama-vision:
    api: http://host.docker.internal:11434/v1
    name: Ollama Vision
    default_model: qwen2.5vl:7b
    models:
      - id: qwen2.5vl:7b
        context_length: 128000
    context_length: 128000
    api_key: ""
plugins:
  clawmem:
    serve_port: 3031
onboarding:
  seen:
    busy_input_prompt: true
delegation:
  model: gemma4:31b
  provider: ollama-cloud
  max_concurrent_children: 4
  max_async_children: 4
  max_iterations: 30
fallback_providers:
  - provider: ollama-cloud
    model: gemma4:31b
  - provider: copilot
    model: gpt-5-mini
  - provider: cursor-go
    model: gpt-5.4-nano-low
  - provider: ollama-vision
    model: qwen2.5vl:7b
agent: {}

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true
#
# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4